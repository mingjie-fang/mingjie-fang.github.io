bio: |
  Mingjie Fang is currently an Associate Professor at the College of Economics and Management, Nanjing Agricultural University, Nanjing, China. 
  He received his PhD from the Department of Logistics, Service and Operations Management (LSOM), Korea University Business School, Seoul, South Korea. 
  His research interests lie in operations and supply chain management, with a particular focus on supply chain relationships, innovation, and sustainability. 
  His work has been published in journals such as the Journal of Management Information Systems, Journal of Business Logistics, Journal of Purchasing and Supply Management, 
  International Journal of Production Economics, Decision Support Systems, International Journal of Physical Distribution & Logistics Management, 
  Industrial Marketing Management, Annals of Operations Research, among others.

